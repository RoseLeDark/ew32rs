; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_speed = 115200
lib_deps = mikalhart/TinyGPSPlus@^1.1.0

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
build_flags = -DEW32_PLATFORM=1

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board_build.core = earlephilhower
board = pico
framework = arduino
; change microcontroller
;board_build.mcu = rp2040
build_flags =  -DEW32_PLATFORM=4  -DPIO_FRAMEWORK_ARDUINO_ENABLE_FREERTOS -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
; Flash Size: 2MB (Sketch: 0.5MB, FS:1.5MB)
board_build.filesystem_size = 1.5m
lib_ldf_mode = chain+
